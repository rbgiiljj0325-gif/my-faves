/* Photo themes: overlay opacity 0 = original, 100 = solid filter */
main{position:relative;isolation:isolate}
main.photo-full::before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(var(--photo-tint),var(--photo-tint)),var(--photo-url);background-size:cover;background-position:center;pointer-events:none}
main.photo-calendar .calendar-panel{background-image:linear-gradient(var(--photo-tint),var(--photo-tint)),var(--photo-url);background-size:cover;background-position:center}
main.photo-header .calendar-header{background-image:linear-gradient(var(--photo-tint),var(--photo-tint)),var(--photo-url);background-size:cover;background-position:center;border-radius:18px;padding:14px;margin-bottom:12px}
main.photo-full .panel,main.photo-calendar .calendar-panel{background-color:rgba(255,255,255,.82)}
main.photo-full .panel{backdrop-filter:blur(5px)}
main.photo-dark .calendar-header,main.photo-dark.photo-calendar .calendar-panel{color:#fff}

.photo-settings{border:1px solid #e4e7ec;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px}
.photo-settings input[type=range]{width:100%}

main.photo-calendar .calendar-panel{background-image:linear-gradient(var(--photo-tint),var(--photo-tint)),var(--photo-url);background-size:cover;background-position:center}
body,main,.panel,.field,.field label,.note,.muted,.weekday,.date,.chip,.event,.tabs{color:var(--ink)}
.muted,.note,.weekday{color:var(--muted-ink)}
.panel,.row,.stack,.field,.event,.photo-settings{min-width:0;max-width:100%}

.field input,.field select,.field textarea,.photo-settings select,select{max-width:100%;min-width:0;background:var(--input-bg);color:var(--input-ink);border-color:var(--line-color)}
.photo-settings{overflow:hidden}.photo-settings input[type=time],.photo-settings select{width:100%;max-width:100%;display:block}
.panel input[type=time],.panel input[type=date]{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.chip{background:var(--card);color:var(--ink)}.chip.active{color:white}
.tabs{background:color-mix(in srgb,var(--card) 94%,transparent);border-color:var(--line-color)}
.event{border-color:var(--line-color)}.event-text{overflow-wrap:anywhere}

dialog .row{flex-wrap:wrap}dialog .row button{flex:1 1 auto}

.couple-order-row{padding:9px 0;border-bottom:1px solid var(--line-color);gap:8px}

/* v3.5.7: touch drag sorting */
.couple-sort-list{display:flex;flex-direction:column;gap:7px;min-width:0}

.couple-detail-hero .row{flex-wrap:wrap;gap:7px}.couple-detail-hero .row>.row{justify-content:flex-start;flex-wrap:wrap}

.related-fave{display:flex;align-items:center;flex-direction:column;justify-content:flex-start;gap:6px;padding:9px 4px;min-width:0;min-height:95px;border-radius:12px;border:1px solid var(--line-color);background:var(--input-bg);color:var(--input-ink);position:relative;cursor:pointer;font-size:12px}

.related-fave-name{font-size:12px;text-align:center;overflow-wrap:anywhere;max-width:100%;line-height:1.3}

.couple-detail-photo{height:auto!important;aspect-ratio:4/3;max-height:none}

.is-dragging{outline:2px dashed var(--main);opacity:.8}
.reminder-group summary{cursor:pointer;padding:5px 0}
.reminder-group>.stack{margin-top:14px;max-height:340px;overflow:auto}

.birthday-fields{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:6px}.birthday-fields input{width:100%;min-width:0}.crop-overlay{position:fixed;inset:0;z-index:999999;background:#000c;display:flex;align-items:center;justify-content:center;padding:12px}.crop-card{background:#302d3c;color:#fff;width:min(100%,520px);max-height:94dvh;overflow:auto;padding:16px;border-radius:20px;display:flex;flex-direction:column;gap:12px}.crop-card h2{margin:0}.crop-stage{display:flex;justify-content:center;align-items:center;min-height:0}.crop-canvas{display:block;max-width:100%;max-height:46dvh;width:auto;height:auto;object-fit:contain;border:2px solid #b6a3df;touch-action:none;border-radius:6px}.crop-controls{display:grid;gap:12px}.crop-controls label{display:grid;gap:6px}.crop-controls select,.crop-controls input{width:100%;max-width:100%;box-sizing:border-box}.crop-card .row{display:flex;gap:6px}.crop-card .row button{flex:1;min-width:0;font-size:14px;padding:10px 4px}@media(max-width:360px){.birthday-fields{grid-template-columns:1fr 1fr}.birthday-fields input:first-child{grid-column:span 2}}
/* iOS Safari: prevent form focus zoom and keep character theme dialog in viewport */

#character-theme-form input[type=color]{width:100%;max-width:100%}
#character-theme-form input[type=range]{width:100%;max-width:100%}
/* Per-character card surfaces, independent from page background and text */
main.character-detail-page .panel{background:color-mix(in srgb,var(--character-card,var(--card)) calc(var(--panel-opacity)*100%),transparent)}
main.character-detail-page .couple-detail-facts>div,main.character-detail-page .couple-album-item{background:var(--character-box,var(--input-bg));color:var(--character-box-text,var(--input-ink))}

/* Stable iPhone modal scale: prevent Safari focus zoom on every form */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#modal{box-sizing:border-box;width:calc(100vw - 24px);max-width:480px;max-height:calc(100dvh - 24px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}

#modal .field,#modal .stack,#modal .grid2{min-width:0;max-width:100%}
#modal .grid2>*{min-width:0}

#modal .detail-photo{width:100%;max-height:72dvh;object-fit:cover;background:transparent}

/* Compact accordion sections and journal event view */
.settings-fold,.tracker-fold{display:block;min-width:0;overflow:hidden}
.settings-fold>summary,.tracker-fold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;font-weight:800;padding:5px 0;min-height:42px}

.settings-fold>summary:after,.tracker-fold>summary:after{content:'⌄';font-size:22px;opacity:.75;transition:transform .2s}
.settings-fold[open]>summary:after,.tracker-fold[open]>summary:after{transform:rotate(180deg)}
.tracker-fold>summary small{font-size:12px;font-weight:500;color:var(--muted-ink);margin-left:auto;text-align:right}
.fold-body{padding-top:14px;min-width:0}
.journal-detail{gap:0!important;overflow:hidden;border-radius:16px}

function editCoupleListOrder(){

 <button type="button" class="btn" data-close>완료</button></div>`);
 const list=document.getElementById('couple-sort-list'),dialog=document.getElementById('modal');
 let dragging=null,handle=null,startY=0,activePointer=null;

 const persist=async ()=>{
  const reordered=[...list.querySelectorAll('[data-sort-id]')].map(el=>el.dataset.sortId);

 list.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.sort-handle');if(!h)return;
  dragging=h.closest('.couple-sort-row');handle=h;activePointer=e.pointerId;startY=e.clientY;
  dragging.classList.add('is-dragging');
  try{h.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
 });
 list.addEventListener('pointermove',e=>{
  if(!dragging||e.pointerId!==activePointer)return;
  const y=e.clientY;
  dragging.style.transform=`translateY(${y-startY}px)`;
  dragging.style.zIndex='2';
  const rows=[...list.querySelectorAll('.couple-sort-row')].filter(r=>r!==dragging);
  for(const row of rows){
   const r=row.getBoundingClientRect(),mid=(r.top+r.bottom)/2;
   if(y>=r.top&&y<=r.bottom){
    if(y<mid)list.insertBefore(dragging,row);
    else list.insertBefore(dragging,row.nextSibling);
    startY=y;dragging.style.transform='translateY(0px)';
    break;
   }
  }
  const rect=dialog.getBoundingClientRect();
  if(y>rect.bottom-85)dialog.scrollTop+=12;
  else if(y<rect.top+85)dialog.scrollTop-=12;
  renumber();
  e.preventDefault();
 });
 const finish=e=>{
  if(!dragging||e.pointerId!==activePointer)return;
  dragging.style.transform='';dragging.style.zIndex='';dragging.classList.remove('is-dragging');
  dragging=null;handle=null;activePointer=null;persist();
 };
 list.addEventListener('pointerup',finish);
 list.addEventListener('pointercancel',finish);
 // Keyboard alternative: focus a handle, then use arrow keys to move.
 list.addEventListener('keydown',e=>{
  if(!e.target.classList.contains('sort-handle')||!['ArrowUp','ArrowDown'].includes(e.key))return;
  e.preventDefault();const row=e.target.closest('.couple-sort-row');
  const other=e.key==='ArrowUp'?row.previousElementSibling:row.nextElementSibling;
  if(!other||!other.classList.contains('couple-sort-row'))return;
  if(e.key==='ArrowUp')list.insertBefore(row,other);else list.insertBefore(other,row);
  renumber();persist();
 });
}

function characterRelatedPanels(p){

 const keys=new Set([...tags(p),...normalizeTags(String(p.name||'').replace(/\s+/g,'')).map(norm)]);
 const matches=x=>(x.profileIds||[]).includes(p.id)||tags(x).some(t=>keys.has(t));
 return [['events','▦ 관련 일정'],['journalEntries','✎ 관련 하루 기록']].map(([type,label])=>{

 return `<section class="panel stack"><strong>${label} (${rows.length})</strong>${rows.slice(0,3).map(row).join('')}${rows.length>3?`<details class="character-related-more"><summary>더보기 (${rows.length-3})</summary>${rows.slice(3).map(row).join('')}</details>`:''}</section>`;
 }).join('');
}

async function setCouplePosition(id,target){
 const keys=['representative','one','two','three'];
 if(!profile(id))return;
 const slots=state.coupleSlots||{representative:'',one:'',two:'',three:''};
 const old=keys.find(k=>slots[k]===id);
 if(target==='none'){if(old)slots[old]=''}
 else if(keys.includes(target)){
  if(old!==target){const displaced=slots[target]||'';slots[target]=id;if(old)slots[old]=displaced;}
 }
 state.coupleSlots=slots;
 state.coupleRepresentative=slots.representative||'';
 state.couplePinned=['one','two','three'].map(k=>slots[k]).filter(Boolean);
 if(!(await save()))return;closeModal();render();
}

function editFolder(id,parentId=''){let f=folder(id)||{id:uid(),name:'',parentId:parentId,color:'#6E9FD4',theme:null};showModal(`<h2>${id?'폴더 수정':'새 폴더'}</h2><form id="folder-form" class="stack"><label class="field">폴더 이름<input name="name" required maxlength="50" value="${esc(f.name)}"></label><label class="field">폴더 위치<select name="parentId"><option value="">장르 폴더 (상위)</option>${state.folders.filter(x=>x.id!==id&&(!id||!folderDescendants(id).includes(x.id))).map(x=>`<option value="${x.id}" ${f.parentId===x.id?'selected':''}>${esc(folderLabel(x.id))} 안의 하위 폴더</option>`).join('')}</select></label><label class="field">일정 구분 색상<input type="color" name="color" value="${f.color}"></label><label class="field"><input type="checkbox" name="customTheme" ${f.theme?'checked':''}> 이 폴더만의 테마 사용 (끄면 상위 폴더 테마 적용)</label>${['포인트','배경','보조'].map((label,i)=>`<label class="field">${label} 색상<input type="color" name="theme${i}" value="${(f.theme||state.theme)[i]}"></label>`).join('')}<button type="button" class="btn secondary" data-reset-folder-colors>↺ 색상 초기화</button><div class="note">상위 폴더 또는 기본 테마 색상으로 되돌려요. 저장하면 적용돼요.</div>${photoEditor(f.photoTheme,id||"new-folder")}<div class="row"><button type="button" class="btn secondary" data-close>취소</button>${id?'<button type="button" class="btn danger" data-delete-folder>삭제</button>':''}<button class="btn" type="submit">저장</button></div></form>`);let form=document.getElementById('folder-form');form.querySelector('[data-reset-folder-colors]').addEventListener('click',()=>{let parent=folder(form.elements.parentId.value);let colors=parent?.theme||(parent?.parentId?folder(parent.parentId)?.theme:null)||state.theme;form.elements.color.value=parent?.color||colors[0];[0,1,2].forEach(i=>form.elements['theme'+i].value=colors[i]);form.elements.customTheme.checked=false;});form.addEventListener('submit',async e=>{e.preventDefault();let fd=new FormData(form),next={...f,name:fd.get('name').trim(),parentId:fd.get('parentId'),color:fd.get('color'),tags:n function confirmFolderDeletion(id){
 const target=folder(id);if(!target)return;

  ui.filter='all';ui.coupleGenre='all';
  await save();closeModal();render();
 };
}

(function(){

  dragging={id:item.dataset.sortApp,cat:item.dataset.sortCategory,startY:e.clientY,moved:false,pointerId:e.pointerId};
  h.setPointerCapture?.(e.pointerId);

  if(!dragging||e.pointerId!==dragging.pointerId)return;

  if(!dragging.moved)return;
  const items=[...document.querySelectorAll('.attendance-sort-item')].filter(x=>x.dataset.sortCategory===dragging.cat);
  const target=items.find(x=>x.dataset.sortApp!==dragging.id&&e.clientY>=x.getBoundingClientRect().top&&e.clientY<=x.getBoundingClientRect().bottom);
  if(target){const item=items.find(x=>x.dataset.sortApp===dragging.id);if(item){target.parentNode.insertBefore(item,target.getBoundingClientRect().top+target.offsetHeight/2<e.clientY?target.nextSibling:target)}}
 });

  const cat=dragging.cat;
  const ids=[...document.querySelectorAll('.attendance-sort-item')].filter(x=>x.dataset.sortCategory===cat).map(x=>x.dataset.sortApp);

function fixedMonthCosts(){const a=ui.expPeriod==='month'?expenseAnchor():new Date();const y=a.getFullYear(),m=a.getMonth();const first=iso(new Date(y,m,1,12)),last=iso(new Date(y,m+1,0,12));const subs=(state.subscriptions||[]).filter(x=>x.active&&/^\d{4}-\d{2}-\d{2}$/.test(x.start)&&['weekly','monthly','yearly'].includes(x.cycle));let total=0;const rows=subs.map(x=>{let dates=[];for(let n=0;n<10000;n++){const d=subscriptionDate(x.start,x.cycle,n);if(d>last)break;if(d>=first)dates.push(d)}const sum=dates.length*Number(x.amount);total+=sum;return `<div class="panel stack"><div class="row"><strong>${esc(x.title)}</strong><b>${money(sum)}</b></div><div class="muted">${({weekly:'매주',monthly:'매월',yearly:'매년'})[x.cycle]} ${money(x.amount)} · ${dates.length}회</div><div class="note">${dates.length?dates.join(' · '):'이달 결제 예정 없음'}</div><div class="note">다음 결제: ${subscriptionDate(x.start,x.cycle,x.nextIndex||0)}</div></div>`}).join('');showModal(`<h2>월 고정 지출</h2><div class="stack"><div class="muted">${y}년 ${m+1}월 · 활성 구독 기준</div><strong style="font-size:29px">${money(total)}</strong><div class="note">선택 월의 결제 예정액 합계예요. 실제 결제 확인이나 과거 해지 내역은 포함하지 않아요.</div>${rows||'<div class="empty">등록된 구독이 없어요.</div>'}<button class="btn" data-subscriptions>구독 관리</button><button class="btn secondary" data-close>닫기</button></div>`)}
function openMiniCalc(){if(document.getElementById('mini-calc'))return;const el=document.createElement('section');el.id='mini-calc';el.className='mini-calc';el.setAttribute('aria-label','미니 계산기');el.innerHTML=`<div class="mini-calc-head"><strong>⠿ 미니 계산기</strong><button class="btn small secondary" type="button" data-calc-close>닫기</button></div><output aria-live="polite">0</output><div class="mini-calc-keys">${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(k=>`<button type="button" class="btn small ${k==='='?'':'secondary'}" data-calc-key="${k}">${k}</button>`).join('')}</div>`;document.body.append(el);let value='0',stored=null,op=null,fresh=false;const out=el.querySelector('output');function apply(){const b=Number(value);if(stored===null||!op)return b;return op==='+'?stored+b:op==='−'?stored-b:op==='×'?stored*b:b===0?NaN:stored/b}function fmt(n){return Number.isFinite(n)?String(Number(n.toPrecision(12))):'오류'}el.onclick=e=>{if(e.target.closest('[data-calc-close]')){el.remove();return}const k=e.target.closest('[data-calc-key]')?.dataset.calcKey;if(!k)return;if(k==='C'){value='0';stored=null;op=null;fresh=false}else if('0123456789'.includes(k)||k==='.'){if(fresh||value==='오류'){value='0';fresh=false}if(k==='.'&&!value.includes('.'))value+='.';else if(k!=='.'&&value.length<15)value=value==='0'?k:value+k}else if(k==='⌫'){value=value.slice(0,-1)||'0';if(value==='-')value='0'}else if(k==='±'||k==='%'){value=fmt(Number(value)*(k==='±'?-1:.01))}else if(k==='='){value=fmt(apply());stored=null;op=null;fresh=true}else{if(op&&!fresh)value=fmt(apply());stored=Number(value);op=k;fresh=true}out.textContent=value};function place(x,y){const v=window.visualViewport,w=v?.width||innerWidth,h=v?.height||innerHeight,l=v?.offsetLeft||0,t=v?.offsetTop||0;el.style.left=Math.max(l+4,Math.min(x,l+w-el.offsetWidth-4))+'px';el.style.top=Math.max(t+4,Math.min(y,t+h-el.offsetHeight-4))+'px'}place(innerWidth-el.offsetWidth-12,innerHeight-el.offsetHeight-100);const head=el.querySelector('.mini-calc-head');let drag=null;head.onpointerdown=e=>{if(e.target.closest('button'))return;const r=el.getBoundingClientRect();drag={x:e.clientX-r.left,y:e.clientY-r.top};head.setPointerCapture(e.pointerId)};head.onpointermove=e=>{if(drag)place(e.clientX-drag.x,e.clientY-drag.y)};head.onpointerup=head.onpointercancel=()=>drag=null;}

function subscriptionDate(anchor,cycle,n){const [y,m,d]=anchor.split('-').map(Number);if(cycle==='weekly')return iso(new Date(y,m-1,d+n*7,12));const month=m-1+n*(cycle==='yearly'?12:1);return iso(new Date(y,month,Math.min(d,new Date(y,month+1,0).getDate()),12))}
async function syncSubscriptions(){let changed=false;state.subscriptions=Array.isArray(state.subscriptions)?state.subscriptions:[];const now=iso(new Date());for(const sub of state.subscriptions){if(!sub.active||!/^\d{4}-\d{2}-\d{2}$/.test(sub.start)||!['weekly','monthly','yearly'].includes(sub.cycle))continue;let n=Number(sub.nextIndex)||0;for(let count=0;count<10000;count++,n++){const date=subscriptionDate(sub.start,sub.cycle,n);if(date>now)break;const id='subscription-'+sub.id+'-'+date;if(!state.expenses.some(e=>e.id===id))state.expenses.push({id,date,category:'구독',title:sub.title,amount:sub.amount,memo:'자동 구독 기록',tags:sub.tags||[]});sub.nextIndex=n+1;changed=true}}if(changed)return await save();return true}

function editSubscription(id){const old=(state.subscriptions||[]).find(x=>x.id===id),x=old||{id:uid(),title:'',amount:'',cycle:'monthly',start:iso(new Date()),active:true,nextIndex:0};showModal(`<h2>${old?'구독 수정':'구독 등록'}</h2><form id="sub-form" class="stack"><label class="field">서비스 이름<input name="title" required value="${esc(x.title)}"></label><label class="field">금액 (원)<input name="amount" type="number" min="1" step="1" required value="${esc(x.amount)}"></label><label class="field">결제 주기<select name="cycle">${[['weekly','매주'],['monthly','매월'],['yearly','매년']].map(([v,l])=>`<option value="${v}" ${x.cycle===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="field">${old?'다음 결제 기준일 (변경 시)':'첫 결제일'}<input name="start" type="date" required value="${old?subscriptionDate(x.start,x.cycle,x.nextIndex||0):x.start}"></label><div class="note">이미 수동으로 입력한 결제는 중복될 수 있으니 첫 결제일을 확인해 주세요. 수정은 이후 결제에만 적용돼요.</div><div class="row"><button type="button" class="btn secondary" data-subscriptions>취소</button><button class="btn" type="submit">저장</button></div></form>`);document.getElementById('sub-form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),amount=Number(fd.get('amount')),title=fd.get('title').trim();if(!title||!Number.isSafeInteger(amount)||amount<=0)return;const start=fd.get('start'),cycle=fd.get('cycle');const same=old&&cycle===old.cycle&&start===subscriptionDate(old.start,old.cycle,old.nextIndex||0);const next={...x,title,amount,cycle,start:same?old.start:start,nextIndex:same?old.nextIndex:0};state.subscriptions=state.subscriptions||[];if(old)state.subscriptions=state.subscriptions.map(s=>s.id===id?next:s);else state.subscriptions.push(next);if(!await syncSubscriptions()||!await save())return;render();subscriptionsPage()}}

function reminderList(){
 const r=state.reminders||{};if(r.enabled===false)return '';
 const now=new Date(), today=iso(now),day=(offset)=>{let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+offset);return iso(d)};
 let out=[];
 const eventMuted=e=>(r.mutedEvents||[]).includes(e.id)||(e.profileIds||[]).some(id=>(r.mutedProfiles||[]).includes(id));
 for(const n of [1,7]){
  if(r['days'+n]===false)continue;
  const date=day(n);
  for(const e of state.events){
   if(!eventMuted(e)&&occurrence(e,date))out.push(`📅 ${esc(e.name)} · ${n}일 전`);
  }
  for(const p of state.profiles){
   if(!p.birthday||(r.mutedProfiles||[]).includes(p.id))continue;
   if(p.birthday.slice(5)===date.slice(5))out.push(`🎂 ${esc(p.name)} 생일 · ${n}일 전`);
  }
 }
 const times=Array.isArray(r.attendanceTimes)?r.attendanceTimes:['22:00','23:30','23:45'];const current=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');const reached=times.filter(t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t)&&t<=current);
 if(r.attendance!==false&&reached.length){
  for(const app of state.attendanceApps){
   if((r.mutedApps||[]).includes(app.id))continue;
   const logs=state.attendanceLogs?.[app.id];
   const done=Array.isArray(logs)?logs.includes(today):!!(logs&&logs[today]);
   if(!done)out.push(`☑️ ${esc(app.name)} · 오늘 출석 미완료 (${reached[reached.length-1]} 확인)`);
  }
 }
 return out.map(x=>`<div class="event"><span>${x}</span></div>`).join('');
}

function updateLiveSearch(input){
 const kind=input.dataset.liveSearch;if(!kind)return;
 ui[kind+'Search']=input.value;
 const app=document.getElementById('app');
 const html=kind==='tag'?tagPage():kind==='journal'?journalPage():kind==='couple'?coupleRoom():foldersPage();
 const next=document.createElement('div');next.innerHTML=html;
 const currentSearch=input.closest('.mf-search-body');
 const nextSearch=next.querySelector('[data-live-search="'+kind+'"]').closest('.mf-search-body');
 // All current search containers are direct children of the page.
 if(currentSearch.parentNode!==app||nextSearch.parentNode!==next)return;
 while(currentSearch.nextSibling)currentSearch.nextSibling.remove();
 while(nextSearch.nextSibling)app.appendChild(nextSearch.nextSibling);
}

function showModal(html){let d=document.getElementById('modal');d.innerHTML=html;if(!d.open)d.showModal()}function closeModal(){let d=document.getElementById('modal');if(d.open)d.close()}function askConfirm(message){return new Promise(resolve=>{showModal(`<div class="stack"><h2>변경 확인</h2><p>${esc(message)}</p><div class="row"><button type="button" class="btn secondary" id="dialog-confirm-no">취소</button><button type="button" class="btn danger" id="dialog-confirm-yes">확인</button></div></div>`);const no=document.getElementById('dialog-confirm-no'),yes=document.getElementById('dialog-confirm-yes');no.onclick=()=>{closeModal();resolve(false)};yes.onclick=()=>{closeModal();resolve(true)}})}const colors=['#E889A7','#D987AC','#F19C8B','#D3A847','#79B78E','#6DB6A5','#6E9FD4','#9A87D5','#B38ABF','#696969','#2B2B38','#F0C8D8'];function palette(value){return `<div class="swatches">${colors.map(c=>`<button type="button" class="swatch ${value===c?'chosen':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div>`}
function birthFromForm(fd){
 const m=Number(fd.get('birthMonth')),d=Number(fd.get('birthDay'));
 if(!m&&!d)return '';
 if(!m||!d||m<1||m>12||d<1||d>31)throw Error('생일은 월과 일을 모두 입력해 주세요.');
 const y=Number(fd.get('birthYear'))||0;
 if(y<0||y>9999)throw Error('출생연도를 확인해 주세요.');
 const check=new Date(Date.UTC(y||2000,m-1,d));
 if(check.getUTCMonth()!==m-1||check.getUTCDate()!==d)throw Error('존재하지 않는 날짜예요.');
 return String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function birthdayEventDate(birthday){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(birthday||''))return '';
 const md=birthday.slice(5);let y=Math.max(today.getFullYear(),Number(birthday.slice(0,4))||today.getFullYear());
 if(md==='02-29'&&!(y%4===0&&(y%100!==0||y%400===0)))y+=4-y%4;
 return `${y}-${md}`;
}
function syncProfileBirthday(p,oldBirthday=''){
 const linked=state.events.find(e=>e.birthdayProfileId===p.id);
 if(!p.birthday){if(linked)state.events=state.events.filter(e=>e.id!==linked.id);return}
 const date=birthdayEventDate(p.birthday);
 if(!date)return;
 if(linked){
  // A user-edited calendar event retains its name, recurrence and other choices.
  // Only adjust the date when it still matches the previously generated date.
  if(oldBirthday&&linked.date===birthdayEventDate(oldBirthday))linked.date=date;
  return;
 }
 if(p.birthdayEventDisabled)return;

/* Daily diary: multiple posts per date, photos, themes and sticker accents */
state.dailyPosts=Array.isArray(state.dailyPosts)?state.dailyPosts:[];
function feedPostCard(post){
 const linked=state.events.find(e=>e.id===post.eventId),who=profile(post.profileId);
 const photos=Array.isArray(post.photos)?post.photos:[];
 return `<article class="feed-card ${post.theme==='scrap'?'scrap':post.theme==='dark'?'dark':''}">
 <div class="feed-pad"><div class="muted" style="font-size:11px">MY DAILY STORY · ${esc(post.date)}</div><strong>${esc(post.title||'오늘의 기록')} ${esc(post.mood||'💜')}</strong></div>
 ${photos.length?`<div class="feed-media"><div class="feed-photos">${photos.map((pic,i)=>`<img src="${pic}" alt="기록 사진 ${i+1}" loading="lazy">`).join('')}</div>${post.sticker?`<span class="feed-sticker">${esc(post.sticker)}</span>`:''}</div>`:''}
 <div class="feed-pad"><div class="feed-caption">${esc(post.body||'')}</div>${post.tags?`<div class="feed-tag">${normalizeTags(post.tags).map(t=>`<button type="button" class="tag-pill" data-open-tag="${esc(t)}">#${esc(t)}</button>`).join(" ")}</div>`:""}
 ${who?`<div class="feed-tag">♡ ${esc(who.name)}</div>`:''}${linked?`<div class="feed-tag">📅 ${esc(linked.name)}</div>`:''}
 <div class="feed-actions"><button class="btn small secondary" data-feed-edit="${esc(post.id)}">수정</button><button class="btn small danger" data-feed-delete="${esc(post.id)}">삭제</button></div></div></article>`;
}
function feedDay(date){const posts=state.dailyPosts.filter(p=>p.date===date).slice().sort((a,b)=>b.created-a.created);return `<div class="stack"><div class="row"><strong>📸 하루 피드 · ${posts.length}개</strong><button class="btn small" data-feed-add="${date}">+ 오늘의 기록</button></div>${posts.map(feedPostCard).join('')||'<div class="empty">아직 피드가 없어요. 사진이나 일기를 남겨 보세요 ♡</div>'}</div>`}
const oldOpenDay=openDay;
openDay=function(date){oldOpenDay(date);const modal=document.getElementById('modal');const root=modal.querySelector('.day-modal');if(root){root.insertAdjacentHTML('beforeend',feedDay(date));modal.dataset.day=date}}
function feedEditor(id,date){
 const old=state.dailyPosts.find(p=>p.id===id),post=old||{id:uid(),date,title:'',body:'',tags:'',mood:'💜',theme:'scrap',sticker:'✨',profileId:'',eventId:'',photos:[],created:Date.now()};
 const choices=state.events.filter(e=>occurrence(e,post.date));
 showModal(`<div class="feed-form stack"><h2>${old?'피드 수정':'하루 피드 작성'} ♡</h2><form id="feed-form" class="stack">
 <label class="field">날짜<input type="date" name="date" required value="${esc(post.date)}"></label>
 <label class="field">제목<input name="title" maxlength="80" placeholder="오늘의 기록 ♡" value="${esc(post.title)}"></label>
 <label class="field">일기<textarea name="body" rows="5" placeholder="오늘의 이야기를 적어 봐요">${esc(post.body)}</textarea></label>
 <label class="field">해시태그<input name="tags" placeholder="#덕질일기 #최애" value="${esc(post.tags)}"></label>
 <div class="row"><label class="field">기분<select name="mood">${['💜','🥰','😭','✨','😴','🔥','🎂','💕'].map(x=>`<option ${post.mood===x?'selected':''}>${x}</option>`).join('')}</select></label>
 <label class="field">꾸미기<select name="theme">${[['simple','심플'],['scrap','스크랩북'],['dark','다크']].map(([v,t])=>`<option value="${v}" ${post.theme===v?'selected':''}>${t}</option>`).join('')}</select></label></div>
 <label class="field">스티커<select name="sticker">${['','✨','🎀','💜','🌸','🎂','⭐','🦋','💌'].map(x=>`<option value="${x}" ${post.sticker===x?'selected':''}>${x||'없음'}</option>`).join('')}</select></label>
 <label class="field">관련 최애<select name="profileId"><option value="">선택 안 함</option>${state.profiles.map(p=>`<option value="${esc(p.id)}" ${p.id===post.profileId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
 <label class="field">연결할 일정<select name="eventId"><option value="">연결 안 함</option>${choices.map(e=>`<option value="${esc(e.id)}" ${e.id===post.eventId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label>
 <label class="field">사진 추가 (여러 장 가능)<input type="file" id="feed-files" accept="image/*" multiple></label>
 <div class="note">사진은 최대 5장까지 저장해요. 모바일 저장 공간에 따라 사진이 많으면 저장되지 않을 수 있어요.</div>
 <div class="feed-preview">${(post.photos||[]).map(pic=>`<img src="${pic}" alt="저장된 사진">`).join('')}</div>
 ${old&&post.photos?.length?'<label><input type="checkbox" name="removePhotos"> 기존 사진 모두 지우기</label>':''}
 <div class="row"><button type="button" class="btn secondary" data-close>취소</button><button type="submit" class="btn">저장</button></div></form></div>`);
 document.getElementById('feed-form').onsubmit=async ev=>{
  ev.preventDefault();const form=ev.currentTarget,fd=new FormData(form),files=[...document.getElementById('feed-files').files];
  if(files.length>5){alert('사진은 최대 5장까지 선택할 수 있어요.');return}
  const btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='저장 중…';
  try{
   let photos=fd.get('removePhotos')?[]:[...(post.photos||[])];
   for(const file of files){photos.push(await feedImage(file))}
   if(photos.length>5){alert('기존 사진을 포함해 최대 5장까지 저장할 수 있어요.');return}
   const next={...post,date:fd.get('date'),title:fd.get('title').trim(),body:fd.get('body').trim(),tags:fd.get('tags').trim(),mood:fd.get('mood'),theme:fd.get('theme'),sticker:fd.get('sticker'),profileId:fd.get('profileId'),eventId:fd.get('eventId'),photos};
   const previous=state.dailyPosts.slice();state.dailyPosts=old?previous.map(p=>p.id===old.id?next:p):[...previous,next];
   if(!(await save())){state.dailyPosts=previous;return}
   openDay(next.date);
  }catch(error){alert('사진을 처리하지 못했어요. 다른 사진을 선택해 주세요.')}finally{btn.disabled=false;btn.textContent='저장'}
 };
}
function feedImage(file){return new Promise((resolve,reject)=>{
 const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const scale=Math.min(1,1600/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.88))};img.src=reader.result};reader.readAsDataURL(file)
})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-feed-add],[data-feed-edit],[data-feed-delete]');if(!b)return;
 if(b.dataset.feedAdd)feedEditor(null,b.dataset.feedAdd);
 else if(b.dataset.feedEdit){const p=state.dailyPosts.find(x=>x.id===b.dataset.feedEdit);if(p)feedEditor(p.id,p.date)}
 else if(b.dataset.feedDelete){const p=state.dailyPosts.find(x=>x.id===b.dataset.feedDelete);if(!p)return;showModal(`<div class="stack"><h2>기록을 삭제할까요?</h2><div>${esc(p.title||'오늘의 기록')}</div><div class="row"><button class="btn secondary" data-feed-cancel="${esc(p.date)}">취소</button><button class="btn danger" data-feed-confirm="${esc(p.id)}">삭제하기</button></div></div>`)}
});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-feed-cancel],[data-feed-confirm]');if(!b)return;
 if(b.dataset.feedCancel)openDay(b.dataset.feedCancel);
 else {const p=state.dailyPosts.find(x=>x.id===b.dataset.feedConfirm);if(!p)return;const prev=state.dailyPosts.slice();state.dailyPosts=prev.filter(x=>x.id!==p.id);if(!(await save())){state.dailyPosts=prev;return}openDay(p.date)}
});

/* v3.5.14: unified mobile-friendly photo crop editor */
const cropProcessed=new WeakSet();
const cropSelections=new WeakMap();
function chosenPhoto(input){return cropSelections.get(input)||input?.files?.[0]||null;}
document.addEventListener('change',async function cropIntercept(e){
 const input=e.target;
 if(!input.matches('input[type="file"][accept*="image/"]')||input.hasAttribute('data-journal-photo-input')||cropProcessed.has(input))return;
 if(!input.files?.length)return;
 e.preventDefault();e.stopImmediatePropagation();
 const original=[...input.files];
 try{
  const edited=[];
  for(let i=0;i<original.length;i++)edited.push(await openImageCropper(original[i],i+1,original.length));
  if(edited.some(x=>!x)){input.value='';cropSelections.delete(input);return}
  cropSelections.set(input,edited[0]);
  try{const dt=new DataTransfer();edited.forEach(f=>dt.items.add(f));input.files=dt.files;}catch(err){console.warn('iOS file replacement unavailable; using edited file directly',err)}
  cropProcessed.add(input);
  try{input.dispatchEvent(new Event('change',{bubbles:true}));}finally{cropProcessed.delete(input)}
 }catch(err){cropProcessed.delete(input);input.value='';alert('사진 편집 중 문제가 발생했어요. '+err.message)}
},true);
function openImageCropper(file,index,total){return new Promise((resolve,reject)=>{
 // iOS Safari: suspend the parent modal before opening the crop dialog.
 // Two overlapping native modal dialogs can otherwise hide the cropper.
 const parentModal=document.getElementById('modal');
 const reopenParent=!!(parentModal&&parentModal.open);
 const previousScroll=reopenParent?parentModal.scrollTop:0;
 if(reopenParent)parentModal.close();
 let restored=false;
 const restoreParent=()=>{if(restored)return;restored=true;if(reopenParent&&parentModal&&!parentModal.open){parentModal.showModal();parentModal.scrollTop=previousScroll}};
 const url=URL.createObjectURL(file),img=new Image();
 img.onerror=()=>{URL.revokeObjectURL(url);restoreParent();reject(Error('이미지를 열 수 없어요'))};
 img.onload=()=>{
  const overlay=document.createElement('dialog');overlay.className='crop-overlay';overlay.setAttribute('aria-label','사진 편집');
  overlay.innerHTML=`<div class="crop-card"><h2>✂️ 사진 편집 ${total>1?`(${index}/${total})`:''}</h2><div class="crop-stage"><canvas class="crop-canvas" width="1600" height="1600"></canvas></div><div class="crop-controls"><label>자르기 비율<select class="crop-ratio"><option value="free">원본 비율</option><option value="1">1:1 정사각형</option><option value="0.75">3:4 세로</option><option value="1.333333">4:3 가로</option><option value="1.777777">16:9 가로</option></select></label><label>확대 / 축소<input class="crop-zoom" type="range" min="1" max="4" value="1" step="0.05"></label><div class="note">사진을 손가락으로 끌어 원하는 위치로 이동하세요.</div></div><div class="row"><button type="button" class="btn secondary crop-cancel">취소</button><button type="button" class="btn secondary crop-original">원본 사용</button><button type="button" class="btn crop-done">적용</button></div></div>`;
  document.body.appendChild(overlay);try{overlay.showModal()}catch(err){overlay.remove();URL.revokeObjectURL(url);restoreParent();reject(err);return}
  const canvas=overlay.querySelector('canvas'),ctx=canvas.getContext('2d'),ratio=overlay.querySelector('.crop-ratio'),zoom=overlay.querySelector('.crop-zoom');
  let ox=0,oy=0,drag=null;
  const sourceRatio=img.naturalWidth/img.naturalHeight;
  function draw(){
   const ar=ratio.value==='free'?sourceRatio:Number(ratio.value),w=Math.min(2400,Math.max(1200,img.naturalWidth)),h=Math.round(w/ar);
   canvas.width=w;canvas.height=h;
   const base=Math.max(w/img.naturalWidth,h/img.naturalHeight),scale=base*Number(zoom.value),dw=img.naturalWidth*scale,dh=img.naturalHeight*scale;
   ox=Math.max((w-dw)/2,Math.min((dw-w)/2,ox));oy=Math.max((h-dh)/2,Math.min((dh-h)/2,oy));
   ctx.clearRect(0,0,w,h);ctx.drawImage(img,(w-dw)/2+ox,(h-dh)/2+oy,dw,dh);
  }
  ratio.onchange=()=>{ox=0;oy=0;draw()};zoom.oninput=draw;
  canvas.addEventListener('pointerdown',ev=>{ev.preventDefault();drag={x:ev.clientX,y:ev.clientY,ox,oy};canvas.setPointerCapture(ev.pointerId)});
  canvas.addEventListener('pointermove',ev=>{if(!drag)return;ev.preventDefault();const rect=canvas.getBoundingClientRect();ox=drag.ox+(ev.clientX-drag.x)*canvas.width/rect.width;oy=drag.oy+(ev.clientY-drag.y)*canvas.height/rect.height;draw()});
  canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
  const finish=value=>{overlay.close();overlay.remove();URL.revokeObjectURL(url);restoreParent();resolve(value)};overlay.addEventListener('cancel',ev=>{ev.preventDefault();finish(null)},{once:true});
  overlay.querySelector('.crop-cancel').onclick=()=>finish(null);
  overlay.querySelector('.crop-original').onclick=()=>finish(file);
  overlay.querySelector('.crop-done').onclick=()=>{try{const data=canvas.toDataURL('image/jpeg',0.96);const binary=atob(data.split(',')[1]);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);finish(new File([bytes],file.name.replace(/\.[^.]+$/,'')+'-edited.jpg',{type:'image/jpeg'}))}catch(err){overlay.close();overlay.remove();URL.revokeObjectURL(url);restoreParent();reject(err)}};
  draw();
 };img.src=url;
})}
